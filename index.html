<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELANS CREATION | Boutique Price List</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- <link rel="stylesheet" href="css/responsive.css"> -->
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="container nav-container">

        <div class="logo">

            <img
                src="assets/logo.png"
                alt="ELAN'S CREATION Logo"
                class="logo-img"
            >

            <span class="logo-text">
                ELAN'S CREATION
            </span>

        </div>

    </div>

</header>



    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <h1>
                Elegant Boutique Stitching
            </h1>

            <p>
                Custom Blouses • Aari Work • Chudidar • Saree Services
            </p>

        </div>

    </section>



    <!-- ================= PRICE LIST ================= -->

    <section class="services">

        <div class="container">

            <div class="section-title">

                <h2>Price List</h2>

                <p>Updated regularly</p>

            </div>


            <div id="serviceContainer" class="service-grid">

                <!-- Cards loaded from Google Sheets -->

            </div>

        </div>

    </section>



    <!-- ================= CONTACT ================= -->

    <section class="contact">

        <div class="container">

            <h2>Contact</h2>

            <p>
                Have questions about stitching or custom designs?
            </p>

            <a href="#" id="whatsappContact" class="contact-btn">

                <i class="fab fa-whatsapp"></i>

                Chat on WhatsApp

            </a>

        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © <span id="year"></span>

            ELANS CREATION

            All Rights Reserved

        </p>

    </footer>



    <!-- Floating WhatsApp -->

    <a href="#" id="floatingWhatsapp" class="floating-whatsapp">

        <i class="fab fa-whatsapp"></i>

    </a>



    <!-- Scripts -->

    <script src="config/config.js"></script>

    <script src="js/sheets.js"></script>

    <script src="js/services.js"></script>

    <script src="js/whatsapp.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
